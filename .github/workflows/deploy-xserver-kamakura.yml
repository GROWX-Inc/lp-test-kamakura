# .github/workflows/deploy-xserver.yml
# main にマージされたら、対象フォルダだけを Xserver へ FTPS で転送する。
# 初回に GitHub の Settings > Secrets and variables > Actions に以下を登録する（値は担当者が入力。チャットに貼らない）
#   XSERVER_FTP_HOST      例: sv1151.xserver.jp
#   XSERVER_FTP_USER      例: fedeltalita
#   XSERVER_FTP_PASSWORD  FTPパスワード
name: Deploy to Xserver
on:
  push:
    branches: [main]
    paths:
      - "**"
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (本番向け差し替え)
        run: |
          rm -rf dist && mkdir -p dist
          rsync -a --exclude='dist' --exclude='.git' ./ dist/
          # gRev: GitHub Pages(LINK) → 本番(FULL)
          find dist -maxdepth 1 -name "*.html" -exec sed -i 's/MODE:"LINK"/MODE:"FULL"/' {} \;
      - name: Upload via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.XSERVER_FTP_HOST }}
          username: ${{ secrets.XSERVER_FTP_USER }}
          password: ${{ secrets.XSERVER_FTP_PASSWORD }}
          protocol: ftps
          local-dir: dist/
          server-dir: /ifreagroup.co.jp/public_html/kamakura/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            gr/**
            index_preview_full.html
            index_preview_link.html
            mock_reviews.json
            README.md
            config.json
